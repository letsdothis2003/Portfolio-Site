<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Portfolio Site</title>
    <script type="text/javascript">
      var l = window.location;
      var path = l.pathname.replace(/^\/Portfolio-Site/, '').replace(/^\//, '');
      var redirectPath = path ? '#/' + path : '#/';

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/Portfolio-Site/' + redirectPath + l.search + l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
